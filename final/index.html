<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>桌面舱 DesktopDock 状态栏</title>
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <main class="dock-shell" id="desktopApp">
      <header class="dock-titlebar">
        <div class="dock-brand"><span class="dock-brand-mark fluent-icon" aria-hidden="true">&#xE80A;</span><span><strong>桌面舱</strong><small id="dockStatus">桌面状态已就绪</small></span></div>
        <time id="dockClock" aria-label="当前时间"></time>
        <div class="dock-window-actions" aria-label="状态栏控制"><button type="button" data-action="refresh-all" title="刷新" aria-label="刷新桌面数据"><span class="fluent-icon" aria-hidden="true">&#xE72C;</span></button><button type="button" data-action="hide-dock" title="隐藏到托盘" aria-label="隐藏到托盘"><span class="fluent-icon" aria-hidden="true">&#xE738;</span></button></div>
      </header>
      <section class="dock-search" aria-label="快速搜索"><span class="fluent-icon" aria-hidden="true">&#xE721;</span><label class="sr-only" for="dockSearch">搜索应用、快捷方式和文件</label><input id="dockSearch" type="search" autocomplete="off" placeholder="搜索应用、快捷方式和文件" /><kbd>Alt + Space</kbd></section>
      <section class="dock-search-results" id="dockSearchResults" aria-label="搜索结果" hidden></section>
      <div class="dock-summary" id="dockSummary" aria-live="polite"></div>
      <section class="dock-content" id="dockContent" tabindex="-1" aria-live="polite"></section>
      <nav class="dock-nav" id="dockNav" aria-label="桌面舱模块"></nav>
    </main>
    <div class="dock-dialog-layer" id="dockDialogLayer" hidden><section class="dock-dialog" id="dockDialog" role="dialog" aria-modal="true" aria-labelledby="dockDialogTitle"></section></div>
    <div class="dock-toast" id="dockToast" role="status" aria-live="polite"></div>
    <script src="sidebar.js"></script>
  </body>
</html>

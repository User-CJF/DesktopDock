<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>DesktopDock UI 方案评审</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="review-shell">
      <header class="review-header">
        <div class="review-title">
          <span class="review-mark" aria-hidden="true">D</span>
          <div>
            <h1>DesktopDock UI 方案评审</h1>
            <p>统一内容与交互，比较三套视觉体系</p>
          </div>
        </div>
        <div class="review-actions">
          <button class="tool-button" id="themeToggle" type="button" title="切换明暗主题" aria-label="切换明暗主题">
            <span class="fluent-icon" aria-hidden="true">&#xE706;</span>
          </button>
          <button class="review-button" id="compareButton" type="button">
            <span class="fluent-icon" aria-hidden="true">&#xE9D2;</span>
            三案对比
          </button>
        </div>
      </header>

      <section class="review-controls" aria-label="方案和页面控制">
        <div class="control-group" aria-label="选择方案">
          <span class="control-label">方案</span>
          <div class="segmented" id="variantControls"></div>
        </div>
        <div class="control-group" aria-label="选择页面">
          <span class="control-label">页面</span>
          <div class="segmented" id="viewControls"></div>
        </div>
        <div class="current-note" id="currentNote" aria-live="polite"></div>
      </section>

      <section class="stage" id="stage" aria-label="DesktopDock 界面预览"></section>

      <section class="comparison" id="comparison" hidden aria-label="三套方案评分对比"></section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
